<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise Service Instantiator | DevOps Control Plane</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    code, pre { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const API_BASE = window.location.protocol.startsWith("http")
      ? window.location.origin
      : "http://localhost:8080";

    function App() {
      // Auth State
      const [token, setToken] = useState(localStorage.getItem("esi_token") || null);
      const [currentUser, setCurrentUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(false);
      const [authStep, setAuthStep] = useState("login");
      const [loginEmail, setLoginEmail] = useState("admin@azienda.com");
      const [loginPassword, setLoginPassword] = useState("AdminPass123!");
      const [totpCode, setTotpCode] = useState("");
      const [tempSessionToken, setTempSessionToken] = useState(null);

      // Platform State
      const [activeTab, setActiveTab] = useState("catalog");
      const [blueprints, setBlueprints] = useState([]);
      const [instances, setInstances] = useState([]);
      const [connectors, setConnectors] = useState([]);
      const [stats, setStats] = useState(null);
      const [teams, setTeams] = useState([]);
      const [usersList, setUsersList] = useState([]);
      const [auditLogs, setAuditLogs] = useState([]);
      const [selectedCategory, setSelectedCategory] = useState("Tutti");
      const [searchQuery, setSearchQuery] = useState("");
      const [pingResults, setPingResults] = useState({});

      // Wizard Modal State
      const [wizardBlueprint, setWizardBlueprint] = useState(null);
      const [wizardStep, setWizardStep] = useState(1);
      const [wizardForm, setWizardForm] = useState({
        name: "",
        team_id: "",
        team_name: "",
        cost_center: "",
        environment: "dev",
        ttl_days: 14,
        parameters: {},
        env_vars: [{ key: "", value: "" }],
        vault_secret: "secret/data/common"
      });
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);
      const [viewingLogsInstance, setViewingLogsInstance] = useState(null);

      // Backoffice Modal State
      const [showUserModal, setShowUserModal] = useState(false);
      const [newUserForm, setNewUserForm] = useState({ username: "", email: "", password: "", role: "developer", team_id: "" });
      const [showTeamModal, setShowTeamModal] = useState(false);
      const [newTeamForm, setNewTeamForm] = useState({ name: "", slug: "", cost_center: "", lead_email: "", monthly_budget_eur: 2000.0 });
      const [showBlueprintModal, setShowBlueprintModal] = useState(false);
      const [newBpForm, setNewBpForm] = useState({
        id: "",
        title: "",
        category_name: "Database & Storage",
        badge: "Custom DevOps",
        icon: "server",
        description: "",
        connector_id: "docker-connector",
        base_monthly_cost: 25.0,
        inputs: []
      });
      const [newInputField, setNewInputField] = useState({ name: "", label: "", input_type: "text", description: "", required: true, default_value: "" });

      // 2FA Setup Modal State
      const [show2FAModal, setShow2FAModal] = useState(false);
      const [setup2FAData, setSetup2FAData] = useState(null);
      const [verifySetupCode, setVerifySetupCode] = useState("");

      const showToast = (msg, type = "success") => {
        setToastMessage({ text: msg, type });
        setTimeout(() => setToastMessage(null), 4000);
      };

      const authHeaders = () => {
        return token ? { "Authorization": `Bearer ${token}` } : {};
      };

      // Check current user
      const checkUser = async () => {
        if (!token) return;
        try {
          const res = await fetch(`${API_BASE}/api/v1/auth/me`, { headers: authHeaders() });
          if (res.ok) {
            const data = await res.json();
            setCurrentUser(data);
          } else {
            handleLogout();
          }
        } catch (err) {
          console.error("Auth check failed:", err);
        }
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        setAuthLoading(true);
        try {
          const res = await fetch(`${API_BASE}/api/v1/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: loginEmail, password: loginPassword })
          });
          const data = await res.json();
          if (res.ok) {
            if (data.requires_2fa) {
              setTempSessionToken(data.session_token);
              setAuthStep("2fa_prompt");
              showToast("Inserisci il codice 2FA dall'app Authenticator", "info");
            } else {
              localStorage.setItem("esi_token", data.access_token);
              setToken(data.access_token);
              setCurrentUser(data.user);
              showToast("Autenticazione completata con successo!");
            }
          } else {
            alert(data.detail || "Credenziali non corrette");
          }
        } catch (err) {
          alert(`Errore di connessione: ${err.message}`);
        } finally {
          setAuthLoading(false);
        }
      };

      const handleVerify2FA = async (e) => {
        e.preventDefault();
        setAuthLoading(true);
        try {
          const res = await fetch(`${API_BASE}/api/v1/auth/verify-2fa`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: loginEmail, session_token: tempSessionToken, code: totpCode })
          });
          const data = await res.json();
          if (res.ok) {
            localStorage.setItem("esi_token", data.access_token);
            setToken(data.access_token);
            setCurrentUser(data.user);
            setAuthStep("login");
            setTotpCode("");
            showToast("2FA verificato! Accesso garantito.");
          } else {
            alert(data.detail || "Codice 2FA errato");
          }
        } catch (err) {
          alert(`Errore: ${err.message}`);
        } finally {
          setAuthLoading(false);
        }
      };

      const handleLogout = () => {
        localStorage.removeItem("esi_token");
        setToken(null);
        setCurrentUser(null);
        setAuthStep("login");
      };

      // 2FA Setup
      const handleStart2FASetup = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/v1/auth/2fa/setup`, { headers: authHeaders() });
          if (res.ok) {
            setSetup2FAData(await res.json());
            setShow2FAModal(true);
          }
        } catch (err) {
          alert(`Errore 2FA: ${err.message}`);
        }
      };

      const handleConfirm2FAEnable = async () => {
        if (!verifySetupCode) return alert("Inserisci il codice generato dall'app");
        try {
          const res = await fetch(`${API_BASE}/api/v1/auth/2fa/enable`, {
            method: "POST",
            headers: { "Content-Type": "application/json", ...authHeaders() },
            body: JSON.stringify({ secret: setup2FAData.secret, code: verifySetupCode })
          });
          if (res.ok) {
            showToast("2FA abilitato con successo!");
            setShow2FAModal(false);
            setVerifySetupCode("");
            checkUser();
          } else {
            const err = await res.json();
            alert(err.detail);
          }
        } catch (err) {
          alert(`Errore: ${err.message}`);
        }
      };

      // Fetch Data
      const fetchData = async () => {
        try {
          const [bpRes, instRes, connRes, statsRes, teamsRes] = await Promise.all([
            fetch(`${API_BASE}/api/v1/catalog/blueprints`),
            fetch(`${API_BASE}/api/v1/instances`),
            fetch(`${API_BASE}/api/v1/connectors`),
            fetch(`${API_BASE}/api/v1/stats`),
            fetch(`${API_BASE}/api/v1/backoffice/teams`, { headers: authHeaders() }).catch(() => null)
          ]);
          if (bpRes && bpRes.ok) setBlueprints(await bpRes.json());
          if (instRes && instRes.ok) setInstances(await instRes.json());
          if (connRes && connRes.ok) setConnectors(await connRes.json());
          if (statsRes && statsRes.ok) setStats(await statsRes.json());
          if (teamsRes && teamsRes.ok) setTeams(await teamsRes.json());
        } catch (err) {
          console.error("Errore fetch API:", err);
        }
      };

      const fetchBackofficeData = async () => {
        if (!token) return;
        try {
          const [uRes, aRes] = await Promise.all([
            fetch(`${API_BASE}/api/v1/backoffice/users`, { headers: authHeaders() }),
            fetch(`${API_BASE}/api/v1/backoffice/audit-logs`, { headers: authHeaders() })
          ]);
          if (uRes.ok) setUsersList(await uRes.json());
          if (aRes.ok) setAuditLogs(await aRes.json());
        } catch (err) {
          console.error("Errore fetch backoffice:", err);
        }
      };

      useEffect(() => {
        if (token) {
          checkUser();
          fetchData();
          fetchBackofficeData();
          const interval = setInterval(() => {
            fetchData();
            if (activeTab === "backoffice_users" || activeTab === "audit_logs") {
              fetchBackofficeData();
            }
          }, 3500);
          return () => clearInterval(interval);
        }
      }, [token, activeTab]);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [blueprints, instances, activeTab, wizardBlueprint, wizardStep, currentUser, authStep, teams, usersList, auditLogs]);

      // Dynamic cost calculator
      const calculateWizardCost = () => {
        if (!wizardBlueprint) return 0;
        let cost = wizardBlueprint.base_monthly_cost;
        for (const field of wizardBlueprint.fields) {
          if (field.type === "select" && field.options) {
            const val = wizardForm.parameters[field.name] || field.default;
            const opt = field.options.find(o => o.value === val);
            if (opt && opt.cost_multiplier) cost *= opt.cost_multiplier;
          }
        }
        return Math.round(cost * 100) / 100;
      };

      // Open Wizard with real team preselected
      const openWizard = (bp) => {
        const initialParams = {};
        bp.fields.forEach(f => {
          initialParams[f.name] = f.default !== undefined ? f.default : "";
        });
        const firstTeam = teams.length > 0 ? teams[0] : null;
        setWizardBlueprint(bp);
        setWizardStep(1);
        setWizardForm({
          name: "",
          team_id: firstTeam ? firstTeam.id : "",
          team_name: firstTeam ? firstTeam.name : "Platform & DevOps Core",
          cost_center: firstTeam ? firstTeam.cost_center : "CC-DEVOPS-01",
          environment: "dev",
          ttl_days: 14,
          parameters: initialParams,
          env_vars: [{ key: "ENV_STAGE", value: "dev" }],
          vault_secret: "secret/data/database/credentials"
        });
      };

      const handleProvisionSubmit = async () => {
        setIsSubmitting(true);
        try {
          const envsObj = {};
          wizardForm.env_vars.forEach(ev => {
            if (ev.key.trim()) envsObj[ev.key.trim()] = ev.value;
          });

          const payload = {
            blueprint_id: wizardBlueprint.id,
            name: wizardForm.name,
            owner_name: currentUser?.username || "DevOps Admin",
            owner_email: currentUser?.email || "admin@azienda.com",
            team: wizardForm.team_name,
            cost_center: wizardForm.cost_center,
            environment: wizardForm.environment,
            ttl_days: parseInt(wizardForm.ttl_days),
            parameters: {
              ...wizardForm.parameters,
              env_vars: envsObj,
              vault_secret: wizardForm.vault_secret
            }
          };

          const res = await fetch(`${API_BASE}/api/v1/instances`, {
            method: "POST",
            headers: { "Content-Type": "application/json", ...authHeaders() },
            body: JSON.stringify(payload)
          });

          if (res.ok) {
            const created = await res.json();
            setWizardBlueprint(null);
            setActiveTab("instances");
            showToast(`Richiesta "${created.name}" inviata al motore di orchestrazione!`);
            fetchData();
          } else {
            const err = await res.json();
            alert(`Errore: ${err.detail || "Impossibile completare la richiesta"}`);
          }
        } catch (err) {
          alert(`Errore: ${err.message}`);
        } finally {
          setIsSubmitting(false);
        }
      };

      const handlePing = async (instanceId) => {
        setPingResults(prev => ({ ...prev, [instanceId]: { loading: true } }));
        try {
          const res = await fetch(`${API_BASE}/api/v1/instances/${instanceId}/ping`, { method: "POST" });
          const data = await res.json();
          setPingResults(prev => ({ ...prev, [instanceId]: { ...data, loading: false } }));
          showToast(data.message, data.online ? "success" : "error");
        } catch (err) {
          setPingResults(prev => ({ ...prev, [instanceId]: { online: false, message: err.message, loading: false } }));
        }
      };

      const handleAction = async (instanceId, action, params = null) => {
        try {
          const res = await fetch(`${API_BASE}/api/v1/instances/${instanceId}/actions`, {
            method: "POST",
            headers: { "Content-Type": "application/json", ...authHeaders() },
            body: JSON.stringify({ action, parameters: params })
          });
          if (res.ok) {
            const data = await res.json();
            showToast(data.message || `Azione ${action} eseguita!`);
            fetchData();
          } else {
            const err = await res.json();
            alert(`Errore: ${err.detail}`);
          }
        } catch (err) {
          alert(`Errore: ${err.message}`);
        }
      };

      const handleDelete = async (instanceId, name) => {
        if (!confirm(`Sei sicuro di voler de-provisionare "${name}"?`)) return;
        try {
          const res = await fetch(`${API_BASE}/api/v1/instances/${instanceId}`, {
            method: "DELETE",
            headers: authHeaders()
          });
          if (res.ok) {
            showToast(`Istanza "${name}" de-provisionata ed eliminata.`);
            fetchData();
          }
        } catch (err) {
          alert(`Errore: ${err.message}`);
        }
      };

      // Backoffice: User Creation
      const handleCreateUser = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch(`${API_BASE}/api/v1/backoffice/users`, {
            method: "POST",
            headers: { "Content-Type": "application/json", ...authHeaders() },
            body: JSON.stringify(newUserForm)
          });
          if (res.ok) {
            showToast(`Utente ${newUserForm.username} creato!`);
            setShowUserModal(false);
            setNewUserForm({ username: "", email: "", password: "", role: "developer", team_id: "" });
            fetchBackofficeData();
          } else {
            const err = await res.json();
            alert(err.detail);
          }
        } catch (err) {
          alert(err.message);
        }
      };

      // Backoffice: Team Creation
      const handleCreateTeam = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch(`${API_BASE}/api/v1/backoffice/teams`, {
            method: "POST",
            headers: { "Content-Type": "application/json", ...authHeaders() },
            body: JSON.stringify(newTeamForm)
          });
          if (res.ok) {
            showToast(`Team ${newTeamForm.name} creato!`);
            setShowTeamModal(false);
            setNewTeamForm({ name: "", slug: "", cost_center: "", lead_email: "", monthly_budget_eur: 2000.0 });
            fetchData();
          } else {
            const err = await res.json();
            alert(err.detail);
          }
        } catch (err) {
          alert(err.message);
        }
      };

      // Backoffice: Blueprint Creation
      const handleCreateBlueprint = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch(`${API_BASE}/api/v1/backoffice/blueprints`, {
            method: "POST",
            headers: { "Content-Type": "application/json", ...authHeaders() },
            body: JSON.stringify(newBpForm)
          });
          if (res.ok) {
            showToast(`Blueprint ${newBpForm.title} creato e pubblicato!`);
            setShowBlueprintModal(false);
            setNewBpForm({
              id: "",
              title: "",
              category_name: "Database & Storage",
              badge: "Custom DevOps",
              icon: "server",
              description: "",
              connector_id: "docker-connector",
              base_monthly_cost: 25.0,
              inputs: []
            });
            fetchData();
          } else {
            const err = await res.json();
            alert(err.detail);
          }
        } catch (err) {
          alert(err.message);
        }
      };

      const handleAddInputField = () => {
        if (!newInputField.name || !newInputField.label) return alert("Inserisci nome e label per il campo");
        setNewBpForm(prev => ({
          ...prev,
          inputs: [...prev.inputs, { ...newInputField, display_order: prev.inputs.length + 1 }]
        }));
        setNewInputField({ name: "", label: "", input_type: "text", description: "", required: true, default_value: "" });
      };

      const categories = ["Tutti", ...new Set(blueprints.map(b => b.category))];
      const filteredBlueprints = blueprints.filter(b => {
        const matchesCategory = selectedCategory === "Tutti" || b.category === selectedCategory;
        const matchesSearch = b.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              b.description.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      const isAdminOrDevOps = currentUser?.role === "admin" || currentUser?.role === "devops_lead";

      // ----------------------------------------------------------------------
      // LOGIN / 2FA VIEW
      // ----------------------------------------------------------------------
      if (!token) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 flex items-center justify-center p-4">
            <div className="max-w-md w-full bg-slate-900/90 border border-slate-800 rounded-2xl shadow-2xl p-8 backdrop-blur-md">
              <div className="text-center mb-8">
                <div className="w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-500 to-cyan-400 mx-auto flex items-center justify-center text-white shadow-lg shadow-indigo-500/20 mb-3">
                  <i data-lucide="layers" className="w-7 h-7"></i>
                </div>
                <h1 className="text-xl font-extrabold text-white tracking-tight">Enterprise Service Instantiator</h1>
                <p className="text-xs text-slate-400 mt-1">DevOps Platform Engineering & Control Plane</p>
                <div className="inline-flex items-center gap-1.5 mt-3 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                  PostgreSQL 16 Engine &bull; 2FA TOTP Secured
                </div>
              </div>

              {authStep === "login" && (
                <form onSubmit={handleLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">
                      Email Aziendale
                    </label>
                    <input
                      type="email"
                      required
                      value={loginEmail}
                      onChange={e => setLoginEmail(e.target.value)}
                      className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-lg text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">
                      Password
                    </label>
                    <input
                      type="password"
                      required
                      value={loginPassword}
                      onChange={e => setLoginPassword(e.target.value)}
                      className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-lg text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>

                  <button
                    type="submit"
                    disabled={authLoading}
                    className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm rounded-lg shadow-lg transition flex items-center justify-center gap-2"
                  >
                    {authLoading ? "Autenticazione in corso..." : "Accedi al Portale"}
                  </button>

                  <div className="pt-4 border-t border-slate-800 text-center">
                    <p className="text-xs text-slate-500 mb-2">Account Pre-configurati per il Test:</p>
                    <div className="flex flex-col gap-1.5">
                      <button
                        type="button"
                        onClick={() => { setLoginEmail("admin@azienda.com"); setLoginPassword("AdminPass123!"); }}
                        className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs font-mono text-left flex justify-between"
                      >
                        <span>admin@azienda.com</span>
                        <span className="text-indigo-400 font-bold">Admin DevOps</span>
                      </button>
                      <button
                        type="button"
                        onClick={() => { setLoginEmail("mario.rossi@azienda.com"); setLoginPassword("DevPass123!"); }}
                        className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs font-mono text-left flex justify-between"
                      >
                        <span>mario.rossi@azienda.com</span>
                        <span className="text-emerald-400 font-bold">Developer Squad</span>
                      </button>
                    </div>
                  </div>
                </form>
              )}

              {authStep === "2fa_prompt" && (
                <form onSubmit={handleVerify2FA} className="space-y-4">
                  <div className="bg-indigo-500/10 border border-indigo-500/30 rounded-xl p-4 text-center">
                    <i data-lucide="smartphone" className="w-8 h-8 text-indigo-400 mx-auto mb-2"></i>
                    <h3 className="font-bold text-sm text-white">Autenticazione a Due Fattori (2FA)</h3>
                    <p className="text-xs text-indigo-200 mt-1">
                      Inserisci il codice temporaneo a 6 cifre dall'app Google / Microsoft Authenticator.
                    </p>
                  </div>

                  <div>
                    <input
                      type="text"
                      maxLength="6"
                      autoFocus
                      required
                      placeholder="123456"
                      value={totpCode}
                      onChange={e => setTotpCode(e.target.value.trim())}
                      className="w-full text-center text-2xl tracking-widest font-mono py-3 bg-slate-950 border border-indigo-500 rounded-lg text-indigo-300 focus:outline-none"
                    />
                  </div>

                  <button
                    type="submit"
                    disabled={authLoading || totpCode.length !== 6}
                    className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm rounded-lg shadow-lg transition"
                  >
                    Verifica & Accedi
                  </button>

                  <button
                    type="button"
                    onClick={() => setAuthStep("login")}
                    className="w-full text-xs text-slate-400 hover:text-slate-200 text-center"
                  >
                    &larr; Torna indietro
                  </button>
                </form>
              )}
            </div>
          </div>
        );
      }

      // ----------------------------------------------------------------------
      // MAIN DASHBOARD (AUTHENTICATED)
      // ----------------------------------------------------------------------
      return (
        <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100">
          {/* Header */}
          <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 shadow-md">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex justify-between items-center h-16">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-cyan-400 flex items-center justify-center text-white shadow-md shadow-indigo-500/20">
                    <i data-lucide="layers" className="w-5 h-5"></i>
                  </div>
                  <div>

            </div>
          )}

          {/* MODALE: BLUEPRINT STUDIO (CREA TEMPLATE SENZA CODICE) */}
          {showBlueprintModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl max-w-xl w-full max-h-[85vh] flex flex-col p-6 text-slate-200">
                <h3 className="font-bold text-base text-white mb-2 flex items-center gap-2">
                  <i data-lucide="sparkles" className="w-5 h-5 text-cyan-400"></i>
                  Blueprint Studio: Crea Nuovo Template
                </h3>
                <p className="text-xs text-slate-400 mb-4">Aggiungi un servizio self-service al catalogo aziendale senza toccare il codice.</p>

                <form onSubmit={handleCreateBlueprint} className="space-y-4 overflow-y-auto flex-1 pr-1 text-xs">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">ID Univoco (Slug)</label>
                      <input
                        type="text"
                        required
                        placeholder="k8s-helm-app"
                        value={newBpForm.id}
                        onChange={e => setNewBpForm({ ...newBpForm, id: e.target.value.toLowerCase().replace(/ /g, "-") })}
                        className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded text-white font-mono"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Titolo Servizio</label>
                      <input
                        type="text"
                        required
                        placeholder="Kubernetes Helm App"
                        value={newBpForm.title}
                        onChange={e => setNewBpForm({ ...newBpForm, title: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded text-white"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">Categoria</label>
                      <select
                        value={newBpForm.category_name}
                        onChange={e => setNewBpForm({ ...newBpForm, category_name: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded text-white"
                      >
                        <option value="Database & Storage">Database & Storage</option>
                        <option value="Networking & Ingress">Networking & Ingress</option>
                        <option value="Microservizi & App">Microservizi & App</option>
                        <option value="Kubernetes & Cloud">Kubernetes & Cloud</option>
                        <option value="CI/CD & DevSecOps">CI/CD & DevSecOps</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Connettore Runtime</label>
                      <select
                        value={newBpForm.connector_id}
                        onChange={e => setNewBpForm({ ...newBpForm, connector_id: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded text-white"
                      >
                        <option value="docker-connector">Docker Engine Connector</option>
                        <option value="process-connector">Local Process Connector</option>
                        <option value="k8s-adapter">Kubernetes & Git Connector</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1">Descrizione Breve</label>
                    <input
                      type="text"
                      required
                      placeholder="Descrivi cosa fa questo template..."
                      value={newBpForm.description}
                      onChange={e => setNewBpForm({ ...newBpForm, description: e.target.value })}
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded text-white"
                    />
                  </div>

                  {/* Aggiunta Campi Dinamici */}
                  <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <div className="font-bold text-white mb-2 flex justify-between items-center">
                      <span>Campi Configurabili ({newBpForm.inputs.length})</span>
                    </div>

                    <div className="space-y-2 mb-3">
                      {newBpForm.inputs.map((inp, idx) => (
                        <div key={idx} className="bg-slate-900 p-2 rounded border border-slate-800 flex justify-between items-center text-xs">
                          <span><strong>{inp.label}</strong> (<code>{inp.name}</code>, tipo: {inp.input_type})</span>
                          <button
                            type="button"
                            onClick={() => setNewBpForm({ ...newBpForm, inputs: newBpForm.inputs.filter((_, i) => i !== idx) })}
                            className="text-rose-400"
                          >
                            Rimuovi
                          </button>
                        </div>
                      ))}
                    </div>

                    <div className="grid grid-cols-2 gap-2 mb-2">
                      <input
                        type="text"
                        placeholder="Nome Campo (es. db_name)"
                        value={newInputField.name}
                        onChange={e => setNewInputField({ ...newInputField, name: e.target.value })}
                        className="px-2.5 py-1.5 bg-slate-900 border border-slate-800 rounded text-white text-xs"
                      />
                      <input
                        type="text"
                        placeholder="Etichetta (es. Nome Database)"
                        value={newInputField.label}
                        onChange={e => setNewInputField({ ...newInputField, label: e.target.value })}
                        className="px-2.5 py-1.5 bg-slate-900 border border-slate-800 rounded text-white text-xs"
                      />
                    </div>
                    <button
                      type="button"
                      onClick={handleAddInputField}
                      className="w-full py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded font-semibold text-xs"
                    >
                      + Aggiungi Campo al Form
                    </button>
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setShowBlueprintModal(false)} className="px-4 py-2 bg-slate-800 text-white rounded">
                      Annulla
                    </button>
                    <button type="submit" className="px-5 py-2 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded">
                      Salva & Pubblica nel Catalogo
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 2FA SETUP MODAL */}
          {show2FAModal && setup2FAData && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl max-w-md w-full p-6 text-slate-200">
                <div className="flex justify-between items-center mb-4">
                  <div className="flex items-center gap-2 text-white font-bold text-sm">
                    <i data-lucide="shield-check" className="w-5 h-5 text-indigo-400"></i>
                    Attiva 2FA (Google / Microsoft Authenticator)
                  </div>
                  <button onClick={() => setShow2FAModal(false)} className="text-slate-400 hover:text-white">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>
                <p className="text-xs text-slate-400 mb-3">Inserisci questa chiave segreta nella tua app Authenticator:</p>
                <div className="bg-slate-950 border border-indigo-500/40 rounded-lg p-3 text-center mb-4">
                  <code className="text-base text-indigo-300 font-bold select-all">{setup2FAData.secret}</code>
                </div>
                <div className="mb-4">
                  <label className="block text-xs font-bold text-slate-300 uppercase mb-1">Codice generato a 6 cifre</label>
                  <input
                    type="text"
                    maxLength="6"
                    placeholder="123456"
                    value={verifySetupCode}
                    onChange={e => setVerifySetupCode(e.target.value.trim())}
                    className="w-full text-center text-xl font-mono py-2 bg-slate-950 border border-slate-700 rounded-lg text-white"
                  />
                </div>
                <div className="flex justify-end gap-2">
                  <button onClick={() => setShow2FAModal(false)} className="px-4 py-2 bg-slate-800 text-white rounded text-xs">Annulla</button>
                  <button onClick={handleConfirm2FAEnable} className="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded text-xs">Abilita 2FA</button>
                </div>
              </div>
            </div>
          )}

          {/* LOGS MODAL */}
          {viewingLogsInstance && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl max-w-2xl w-full max-h-[80vh] flex flex-col overflow-hidden text-slate-200">
                <div className="px-6 py-4 border-b border-slate-800 flex justify-between items-center bg-slate-950">
                  <div className="font-bold text-sm text-white flex items-center gap-2">
                    <i data-lucide="terminal" className="w-4 h-4 text-indigo-400"></i>
                    Audit & Live Logs: {viewingLogsInstance.name}
                  </div>
                  <button onClick={() => setViewingLogsInstance(null)} className="text-slate-400 hover:text-white">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>
                <div className="p-6 font-mono text-xs overflow-y-auto space-y-2 bg-slate-950 flex-1">
                  {viewingLogsInstance.logs && viewingLogsInstance.logs.map((l, idx) => (
                    <div key={idx} className="text-slate-300 border-l-2 border-indigo-500/50 pl-2">{l}</div>
                  ))}
                </div>
                <div className="px-6 py-3 bg-slate-950 border-t border-slate-800 text-right">
                  <button onClick={() => setViewingLogsInstance(null)} className="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 text-white rounded text-xs">Chiudi</button>
                </div>
              </div>
            </div>
          )}

          <footer className="bg-slate-900 border-t border-slate-800 py-6 text-center text-xs text-slate-500">
            Enterprise Service Instantiator Platform &bull; PostgreSQL 16 &bull; Multi-Tenant IAM &bull; Dynamic Blueprint Studio
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
