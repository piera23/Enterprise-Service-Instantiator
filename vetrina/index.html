<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise Service Instantiator | Portale Aziendale</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel Standalone for in-browser JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .animate-pulse-subtle {
      animation: pulse-subtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const API_BASE = window.location.protocol.startsWith("http")
      ? window.location.origin
      : "http://localhost:8080";

    function App() {
      const [activeTab, setActiveTab] = useState("catalog");
      const [blueprints, setBlueprints] = useState([]);
      const [instances, setInstances] = useState([]);
      const [connectors, setConnectors] = useState([]);
      const [stats, setStats] = useState(null);
      const [selectedCategory, setSelectedCategory] = useState("Tutti");
      const [searchQuery, setSearchQuery] = useState("");
      
      // Wizard Modal State
      const [wizardBlueprint, setWizardBlueprint] = useState(null);
      const [wizardStep, setWizardStep] = useState(1);
      const [wizardForm, setWizardForm] = useState({
        name: "",
        owner_name: "Sara Bianchi",
        owner_email: "s.bianchi@azienda.com",
        team: "Solution Consulting",
        cost_center: "CC-CONSULTING-01",
        environment: "dev",
        ttl_days: 14,
        parameters: {}
      });
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      // Log Modal State
      const [viewingLogsInstance, setViewingLogsInstance] = useState(null);

      const showToast = (msg, type = "success") => {
        setToastMessage({ text: msg, type });
        setTimeout(() => setToastMessage(null), 4000);
      };

      const fetchData = async () => {
        try {
          const [bpRes, instRes, connRes, statsRes] = await Promise.all([
            fetch(`${API_BASE}/api/v1/catalog/blueprints`),
            fetch(`${API_BASE}/api/v1/instances`),
            fetch(`${API_BASE}/api/v1/connectors`),
            fetch(`${API_BASE}/api/v1/stats`)
          ]);
          if (bpRes.ok) setBlueprints(await bpRes.json());
          if (instRes.ok) setInstances(await instRes.json());
          if (connRes.ok) setConnectors(await connRes.json());
          if (statsRes.ok) setStats(await statsRes.json());
        } catch (err) {
          console.error("Errore fetch API:", err);
        }
      };

      useEffect(() => {
        fetchData();
        const interval = setInterval(fetchData, 3000); // Polling ogni 3s per aggiornamenti in tempo reale
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [blueprints, instances, activeTab, wizardBlueprint, wizardStep]);

      // Calcolo costo dinamico nel wizard
      const calculateWizardCost = () => {
        if (!wizardBlueprint) return 0;
        let cost = wizardBlueprint.base_monthly_cost;
        for (const field of wizardBlueprint.fields) {
          if (field.type === "select" && field.options) {
            const val = wizardForm.parameters[field.name] || field.default;
            const opt = field.options.find(o => o.value === val);
            if (opt && opt.cost_multiplier) {
              cost *= opt.cost_multiplier;
            }
          }
        }
        return Math.round(cost * 100) / 100;
      };

      const openWizard = (bp) => {
        const initialParams = {};
        bp.fields.forEach(f => {
          initialParams[f.name] = f.default !== undefined ? f.default : "";
        });
        setWizardBlueprint(bp);
        setWizardStep(1);
        setWizardForm({
          name: "",
          owner_name: "Sara Bianchi",
          owner_email: "s.bianchi@azienda.com",
          team: "Solution Consulting",
          cost_center: "CC-CONSULTING-01",
          environment: "dev",
          ttl_days: 14,
          parameters: initialParams
        });
      };

      const handleProvisionSubmit = async () => {
        setIsSubmitting(true);
        try {
          const payload = {
            blueprint_id: wizardBlueprint.id,
            name: wizardForm.name,
            owner_name: wizardForm.owner_name,
            owner_email: wizardForm.owner_email,
            team: wizardForm.team,
            cost_center: wizardForm.cost_center,
            environment: wizardForm.environment,
            ttl_days: parseInt(wizardForm.ttl_days),
            parameters: wizardForm.parameters
          };

          const res = await fetch(`${API_BASE}/api/v1/instances`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          if (res.ok) {
            const created = await res.json();
            setWizardBlueprint(null);
            setActiveTab("instances");
            showToast(`Richiesta "${created.name}" inviata con successo!`);
            fetchData();
          } else {
            const err = await res.json();
            alert(`Errore: ${err.detail || "Impossibile inviare la richiesta"}`);
          }
        } catch (err) {
          alert(`Errore di connessione al server: ${err.message}`);
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleAction = async (instanceId, action, params = null) => {
        try {
          const res = await fetch(`${API_BASE}/api/v1/instances/${instanceId}/actions`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action, parameters: params })
          });
          if (res.ok) {
            const data = await res.json();
            showToast(data.message || `Azione ${action} eseguita!`);
            fetchData();
          } else {
            const err = await res.json();
            alert(`Errore: ${err.detail}`);
          }
        } catch (err) {
          alert(`Errore: ${err.message}`);
        }
      };

      const handleApprove = async (instanceId) => {
        try {
          const res = await fetch(`${API_BASE}/api/v1/instances/${instanceId}/approve`, {
            method: "POST"
          });
          if (res.ok) {
            showToast("Richiesta approvata con successo! Avvio provisioning in corso.");
            fetchData();
          }
        } catch (err) {
          alert(`Errore: ${err.message}`);
        }
      };

      const handleDelete = async (instanceId, name) => {
        if (!confirm(`Sei sicuro di voler de-provisionare ed eliminare definitivamente "${name}"? Tutte le risorse collegate verranno dismesse.`)) return;
        try {
          const res = await fetch(`${API_BASE}/api/v1/instances/${instanceId}`, {
            method: "DELETE"
          });
          if (res.ok) {
            showToast(`Istanza "${name}" eliminata con successo.`);
            fetchData();
          }
        } catch (err) {
          alert(`Errore: ${err.message}`);
        }
      };

      const categories = ["Tutti", ...new Set(blueprints.map(b => b.category))];

      const filteredBlueprints = blueprints.filter(b => {
        const matchesCategory = selectedCategory === "Tutti" || b.category === selectedCategory;
        const matchesSearch = b.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              b.description.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      const pendingApprovals = instances.filter(i => i.status === "APPROVAL_REQUIRED");

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header Superiore */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex justify-between items-center h-16">
                {/* Brand */}
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-blue-500 flex items-center justify-center text-white shadow-md shadow-indigo-200">
                    <i data-lucide="layers" className="w-5 h-5"></i>
                  </div>
                  <div>
                    <h1 className="font-bold text-lg tracking-tight text-slate-900 flex items-center gap-2">
                      Enterprise Service Instantiator
                      <span className="bg-indigo-50 text-indigo-700 text-xs px-2 py-0.5 rounded-full font-semibold border border-indigo-200/60">
                        Self-Service Portal
                      </span>
                    </h1>
                    <p className="text-xs text-slate-500">Istanziatore universale per piattaforme interne, Cloud e SaaS</p>
                  </div>
                </div>

                {/* Right side info & API Swagger Link */}
                <div className="flex items-center gap-4">
                  <a 
                    href={`${API_BASE}/docs`} 
                    target="_blank" 
                    rel="noreferrer"
                    className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200 transition"
                    title="Esplora le API REST OpenAPI con Swagger"
                  >
                    <i data-lucide="code-2" className="w-4 h-4 text-indigo-600"></i>
                    API Swagger (/docs)
                  </a>

                  <div className="h-6 w-px bg-slate-200"></div>

                  <div className="flex items-center gap-2.5 pl-2">
                    <div className="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 font-bold flex items-center justify-center text-xs border border-indigo-200">
                      SB
                    </div>
                    <div className="text-left hidden sm:block">
                      <div className="text-xs font-semibold text-slate-800">Sara Bianchi</div>
                      <div className="text-[11px] text-slate-500">Solution Consulting</div>
                    </div>
                  </div>
                </div>
              </div>

              {/* Navigation Tabs */}
              <nav className="flex space-x-8 -mb-px">
                <button
                  onClick={() => setActiveTab("catalog")}
                  className={`py-3 px-1 border-b-2 font-medium text-sm flex items-center gap-2 transition ${
                    activeTab === "catalog"
                      ? "border-indigo-600 text-indigo-600"
                      : "border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300"
                  }`}
                >
                  <i data-lucide="shopping-bag" className="w-4 h-4"></i>
                  Catalogo Servizi
                  <span className="ml-1 px-1.5 py-0.2 rounded-full text-[11px] bg-slate-100 text-slate-600">
                    {blueprints.length}
                  </span>
                </button>

                <button
                  onClick={() => setActiveTab("instances")}
                  className={`py-3 px-1 border-b-2 font-medium text-sm flex items-center gap-2 transition ${
                    activeTab === "instances"
                      ? "border-indigo-600 text-indigo-600"
                      : "border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300"
                  }`}
                >
                  <i data-lucide="server" className="w-4 h-4"></i>
                  Le Mie Istanze Attive
                  <span className={`ml-1 px-2 py-0.5 rounded-full text-xs font-bold ${
                    instances.length > 0 ? "bg-emerald-100 text-emerald-800" : "bg-slate-100 text-slate-600"
                  }`}>
                    {instances.length}
                  </span>
                </button>

                <button
                  onClick={() => setActiveTab("approvals")}
                  className={`py-3 px-1 border-b-2 font-medium text-sm flex items-center gap-2 transition ${
                    activeTab === "approvals"
                      ? "border-indigo-600 text-indigo-600"
                      : "border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300"
                  }`}
                >
                  <i data-lucide="shield-alert" className="w-4 h-4"></i>
                  Governance & Approvazioni
                  {pendingApprovals.length > 0 && (
                    <span className="ml-1 px-1.5 py-0.5 rounded-full text-xs font-bold bg-amber-500 text-white animate-pulse">
                      {pendingApprovals.length}
                    </span>
                  )}
                </button>

                <button
                  onClick={() => setActiveTab("finops")}
                  className={`py-3 px-1 border-b-2 font-medium text-sm flex items-center gap-2 transition ${
                    activeTab === "finops"
                      ? "border-indigo-600 text-indigo-600"
                      : "border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300"
                  }`}
                >
                  <i data-lucide="trending-down" className="w-4 h-4"></i>
                  FinOps & Risparmio Cloud
                </button>

                <button
                  onClick={() => setActiveTab("connectors")}
                  className={`py-3 px-1 border-b-2 font-medium text-sm flex items-center gap-2 transition ${
                    activeTab === "connectors"
                      ? "border-indigo-600 text-indigo-600"
                      : "border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300"
                  }`}
                >
                  <i data-lucide="cpu" className="w-4 h-4"></i>
                  Piattaforme Collegate
                  <span className="ml-1 px-1.5 py-0.2 rounded-full text-[11px] bg-slate-100 text-slate-600">
                    {connectors.length}
                  </span>
                </button>
              </nav>
            </div>
          </header>

          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 border border-slate-700 animate-bounce">
              <i data-lucide="check-circle" className="w-5 h-5 text-emerald-400"></i>
              <span className="text-sm font-medium">{toastMessage.text}</span>
            </div>
          )}

          {/* Main Content Area */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
            
            {/* TAB 1: CATALOGO SERVIZI */}
            {activeTab === "catalog" && (
              <div>
                {/* Hero Banner per Utenti Non Tecnici */}
                <div className="bg-gradient-to-r from-indigo-900 via-indigo-800 to-slate-900 rounded-2xl p-6 sm:p-8 text-white mb-8 shadow-lg relative overflow-hidden">
                  <div className="relative z-10 max-w-2xl">
                    <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-indigo-500/30 text-indigo-200 border border-indigo-400/30 mb-3">
                      <i data-lucide="sparkles" className="w-3.5 h-3.5 text-indigo-300"></i>
                      Self-Service per Tutti i Dipartimenti
                    </span>
                    <h2 className="text-2xl sm:text-3xl font-extrabold tracking-tight mb-2">
                      Scegli ciò che ti serve. Al resto pensa il portale.
                    </h2>
                    <p className="text-indigo-200 text-sm leading-relaxed mb-4">
                      Non serve aprire ticket o conoscere comandi sistemistici. Seleziona una risorsa dal catalogo, 
                      rispondi a 3 domande semplici e avrai la tua piattaforma configurata e pronta all'uso in pochi minuti.
                    </p>
                    <div className="flex flex-wrap gap-4 text-xs font-medium text-indigo-300">
                      <span className="flex items-center gap-1.5">
                        <i data-lucide="shield-check" className="w-4 h-4 text-emerald-400"></i>
                        Standard di sicurezza garantiti a monte
                      </span>
                      <span className="flex items-center gap-1.5">
                        <i data-lucide="clock" className="w-4 h-4 text-amber-400"></i>
                        Spegnimento automatico anti-spreco
                      </span>
                      <span className="flex items-center gap-1.5">
                        <i data-lucide="key" className="w-4 h-4 text-cyan-400"></i>
                        Credenziali sicure su Vault
                      </span>
                    </div>
                  </div>
                </div>

                {/* Filtri & Ricerca */}
                <div className="flex flex-col sm:flex-row gap-4 justify-between items-center mb-6">
                  {/* Category Pills */}
                  <div className="flex flex-wrap gap-2 w-full sm:w-auto">
                    {categories.map(cat => (
                      <button
                        key={cat}
                        onClick={() => setSelectedCategory(cat)}
                        className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold transition ${
                          selectedCategory === cat
                            ? "bg-indigo-600 text-white shadow-sm"
                            : "bg-white text-slate-600 border border-slate-200 hover:bg-slate-100"
                        }`}
                      >
                        {cat}
                      </button>
                    ))}
                  </div>

                  {/* Search Box */}
                  <div className="relative w-full sm:w-72">
                    <input
                      type="text"
                      placeholder="Cerca servizio o risorsa..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="w-full pl-9 pr-4 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent bg-white"
                    />
                    <div className="absolute left-3 top-2.5 text-slate-400">
                      <i data-lucide="search" className="w-4 h-4"></i>
                    </div>
                  </div>
                </div>

                {/* Griglia Card del Catalogo */}
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-6">
                  {filteredBlueprints.map(bp => (
                    <div 
                      key={bp.id}
                      className="bg-white rounded-xl border border-slate-200/90 hover:border-indigo-300 hover:shadow-md transition p-6 flex flex-col justify-between"
                    >
                      <div>
                        <div className="flex justify-between items-start mb-4">
                          <div className="w-12 h-12 rounded-xl bg-indigo-50 border border-indigo-100 text-indigo-600 flex items-center justify-center shadow-sm">
                            <i data-lucide={bp.icon} className="w-6 h-6"></i>
                          </div>
                          <span className={`text-[11px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider ${
                            bp.badge === "Popolare" 
                              ? "bg-amber-100 text-amber-800 border border-amber-200"
                              : bp.badge === "Golden Path"
                              ? "bg-indigo-100 text-indigo-800 border border-indigo-200"
                              : "bg-emerald-100 text-emerald-800 border border-emerald-200"
                          }`}>
                            {bp.badge}
                          </span>
                        </div>

                        <div className="text-xs font-semibold text-indigo-600 uppercase tracking-wider mb-1">
                          {bp.category}
                        </div>
                        <h3 className="font-bold text-lg text-slate-900 mb-2">
                          {bp.title}
                        </h3>
                        <p className="text-slate-600 text-sm mb-4 leading-relaxed">
                          {bp.description}
                        </p>
                      </div>

                      <div className="pt-4 border-t border-slate-100">
                        <div className="flex justify-between items-center mb-4 text-xs text-slate-500">
                          <span className="flex items-center gap-1">
                            <i data-lucide="zap" className="w-3.5 h-3.5 text-amber-500"></i>
                            Pronto in ~{bp.provisioning_time_seconds} sec
                          </span>
                          <span className="font-semibold text-slate-800">
                            a partire da <span className="text-indigo-600 font-bold text-sm">€{bp.base_monthly_cost.toFixed(2)}</span> / mese
                          </span>
                        </div>

                        <button
                          onClick={() => openWizard(bp)}
                          className="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold text-sm rounded-lg shadow-sm hover:shadow transition flex items-center justify-center gap-2"
                        >
                          <span>Richiedi / Istanzia Subito</span>
                          <i data-lucide="arrow-right" className="w-4 h-4"></i>
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 2: LE MIE ISTANZE */}
            {activeTab === "instances" && (
              <div>
                <div className="flex justify-between items-center mb-6">
                  <div>
                    <h2 className="text-xl font-bold text-slate-900">Le Tue Istanze e Ambienti</h2>
                    <p className="text-sm text-slate-500">Monitora lo stato, consulta le credenziali di accesso ed esegui azioni Day-2.</p>
                  </div>
                  <button
                    onClick={() => setActiveTab("catalog")}
                    className="inline-flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-semibold hover:bg-indigo-700 transition"
                  >
                    <i data-lucide="plus" className="w-4 h-4"></i>
                    Istanzia Nuova Piattaforma
                  </button>
                </div>

                {instances.length === 0 ? (
                  <div className="bg-white rounded-xl border border-slate-200 p-12 text-center max-w-lg mx-auto">
                    <div className="w-16 h-16 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-4">
                      <i data-lucide="server" className="w-8 h-8"></i>
                    </div>
                    <h3 className="font-bold text-lg text-slate-800 mb-2">Nessuna istanza attiva al momento</h3>
                    <p className="text-sm text-slate-500 mb-6">
                      Non hai ancora creato nessuna risorsa. Visita il catalogo per istanziare un ambiente demo, un database o un microservizio.
                    </p>
                    <button
                      onClick={() => setActiveTab("catalog")}
                      className="px-5 py-2.5 bg-indigo-600 text-white font-semibold text-sm rounded-lg hover:bg-indigo-700 transition"
                    >
                      Vai al Catalogo
                    </button>
                  </div>
                ) : (
                  <div className="space-y-4">
                    {instances.map(inst => {
                      const isPending = inst.status === "PENDING" || inst.status === "PROVISIONING";
                      const isApproval = inst.status === "APPROVAL_REQUIRED";
                      const isActive = inst.status === "ACTIVE";

                      return (
                        <div 
                          key={inst.id}
                          className="bg-white rounded-xl border border-slate-200/90 shadow-sm p-6 hover:border-slate-300 transition"
                        >
                          <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 mb-4">
                            {/* Titolo e Icona */}
                            <div className="flex items-start gap-4">
                              <div className="w-12 h-12 rounded-xl bg-indigo-50 border border-indigo-100 text-indigo-600 flex items-center justify-center shrink-0">
                                <i data-lucide={inst.icon || "server"} className="w-6 h-6"></i>
                              </div>
                              <div>
                                <div className="flex items-center gap-2 mb-1 flex-wrap">
                                  <h3 className="font-bold text-base text-slate-900">{inst.name}</h3>
                                  <span className="text-xs text-slate-400">•</span>
                                  <span className="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded">
                                    {inst.blueprint_title}
                                  </span>
                                  <span className="text-xs font-bold uppercase px-2 py-0.5 rounded bg-slate-100 text-slate-600">
                                    {inst.environment}
                                  </span>
                                </div>
                                <div className="text-xs text-slate-500 flex flex-wrap gap-x-4 gap-y-1">
                                  <span>Owner: <strong className="text-slate-700">{inst.owner_name}</strong> ({inst.team})</span>
                                  <span>Centro di Costo: <strong className="text-slate-700">{inst.cost_center}</strong></span>
                                  <span>Costo: <strong className="text-indigo-600 font-semibold">€{inst.monthly_cost.toFixed(2)}/mese</strong></span>
                                </div>
                              </div>

                          <p className="text-[11px] text-slate-400 mt-1">{field.description}</p>
                        </div>
                      ))}
                    </div>
                  )}

                  {/* STEP 3: SUMMARY & CONFIRMATION */}
                  {wizardStep === 3 && (
                    <div className="space-y-4">
                      <div className="bg-indigo-50/60 border border-indigo-100 rounded-xl p-4">
                        <div className="text-xs font-bold text-indigo-700 uppercase tracking-wider mb-1">
                          Stima Economica Mensile
                        </div>
                        <div className="text-3xl font-extrabold text-indigo-900">
                          €{calculateWizardCost().toFixed(2)} <span className="text-xs font-normal text-slate-500">/ mese</span>
                        </div>
                        <p className="text-[11px] text-indigo-700 mt-1">
                          Verrà imputato al centro di costo: <strong>{wizardForm.cost_center}</strong>
                        </p>
                      </div>

                      <div className="border border-slate-200 rounded-xl p-4 space-y-2 text-xs">
                        <div className="flex justify-between py-1 border-b border-slate-100">
                          <span className="text-slate-500">Nome Istanza:</span>
                          <span className="font-bold text-slate-800">{wizardForm.name || "Senza nome"}</span>
                        </div>
                        <div className="flex justify-between py-1 border-b border-slate-100">
                          <span className="text-slate-500">Tipo Piattaforma:</span>
                          <span className="font-bold text-slate-800">{wizardBlueprint.title}</span>
                        </div>
                        <div className="flex justify-between py-1 border-b border-slate-100">
                          <span className="text-slate-500">Ambiente:</span>
                          <span className="font-bold uppercase text-slate-800">{wizardForm.environment}</span>
                        </div>
                        <div className="flex justify-between py-1 border-b border-slate-100">
                          <span className="text-slate-500">Spegnimento programmato:</span>
                          <span className="font-bold text-slate-800">Dopo {wizardForm.ttl_days} giorni</span>
                        </div>
                        <div className="flex justify-between py-1">
                          <span className="text-slate-500">Stato Approvazione:</span>
                          {wizardForm.environment === "prod" || calculateWizardCost() > wizardBlueprint.auto_approval_limit_eur ? (
                            <span className="font-bold text-amber-700 bg-amber-100 px-2 py-0.5 rounded">
                              Richiede Approvazione
                            </span>
                          ) : (
                            <span className="font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded">
                              Auto-Approvato Istantaneamente
                            </span>
                          )}
                        </div>
                      </div>
                    </div>
                  )}
                </div>

                {/* Modal Footer */}
                <div className="px-6 py-4 bg-slate-50 border-t border-slate-200 flex justify-between items-center">
                  {wizardStep > 1 ? (
                    <button
                      onClick={() => setWizardStep(wizardStep - 1)}
                      className="px-4 py-2 border border-slate-200 text-slate-700 rounded-lg text-sm font-semibold hover:bg-slate-100 transition"
                    >
                      Indietro
                    </button>
                  ) : (
                    <div></div>
                  )}

                  {wizardStep < 3 ? (
                    <button
                      disabled={wizardStep === 1 && !wizardForm.name.trim()}
                      onClick={() => setWizardStep(wizardStep + 1)}
                      className="px-5 py-2 bg-indigo-600 disabled:bg-slate-300 text-white rounded-lg text-sm font-semibold hover:bg-indigo-700 transition flex items-center gap-1.5"
                    >
                      <span>Avanti</span>
                      <i data-lucide="chevron-right" className="w-4 h-4"></i>
                    </button>
                  ) : (
                    <button
                      disabled={isSubmitting}
                      onClick={handleProvisionSubmit}
                      className="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white rounded-lg text-sm font-bold shadow-md hover:shadow-lg transition flex items-center gap-2"
                    >
                      {isSubmitting ? (
                        <>
                          <i data-lucide="loader-2" className="w-4 h-4 animate-spin"></i>
                          <span>Elaborazione in corso...</span>
                        </>
                      ) : (
                        <>
                          <i data-lucide="rocket" className="w-4 h-4"></i>
                          <span>Istanzia Ora</span>
                        </>
                      )}
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* LOG VIEWER MODAL */}
          {viewingLogsInstance && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 rounded-2xl shadow-2xl max-w-2xl w-full max-h-[80vh] flex flex-col overflow-hidden text-slate-200">
                <div className="px-6 py-4 border-b border-slate-800 flex justify-between items-center bg-slate-950">
                  <div className="flex items-center gap-2">
                    <i data-lucide="terminal" className="w-5 h-5 text-indigo-400"></i>
                    <h3 className="font-bold text-sm text-white">Registro Eventi & Audit: {viewingLogsInstance.name}</h3>
                  </div>
                  <button 
                    onClick={() => setViewingLogsInstance(null)}
                    className="text-slate-400 hover:text-white"
                  >
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>
                <div className="p-6 font-mono text-xs overflow-y-auto space-y-2 bg-slate-900/90 flex-1">
                  {viewingLogsInstance.logs && viewingLogsInstance.logs.map((log, idx) => (
                    <div key={idx} className="leading-relaxed text-slate-300 border-l-2 border-indigo-500/50 pl-2">
                      {log}
                    </div>
                  ))}
                </div>
                <div className="px-6 py-3 bg-slate-950 border-t border-slate-800 text-right">
                  <button
                    onClick={() => setViewingLogsInstance(null)}
                    className="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 text-white rounded text-xs font-semibold"
                  >
                    Chiudi
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-white border-t border-slate-200 py-6 mt-12 text-center text-xs text-slate-400">
            Enterprise Service Instantiator Platform • API-First & Adapter-Based Architecture
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
